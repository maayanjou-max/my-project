<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סוכן מידע תרופות</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .main-container { background: rgba(255, 255, 255, 0.95); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); margin: 2rem auto; max-width: 800px; }
        .header { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; padding: 2rem; border-radius: 20px 20px 0 0; text-align: center; }
        .search-section { padding: 2rem; }
        .search-input { border: 2px solid #e9ecef; border-radius: 15px; padding: 1rem 1.5rem; font-size: 1.1rem; }
        .search-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border: none; border-radius: 15px; padding: 1rem 2rem; font-weight: bold; }
        .result-card { background: white; border-radius: 15px; padding: 2rem; margin-top: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <div class="header">
                <h1>סוכן מידע תרופות</h1>
                <p>חיפוש מידע מהימן על תרופות</p>
                <small>MedlinePlus | MicroMedx | UpToDate</small>
                <div style="margin-top: 1rem;">
                    <a href="/chat" class="btn btn-light" style="border-radius: 20px; padding: 0.5rem 1.5rem;">
                        🤖 סוכן שיחה חכם - שאל שאלות ספציפיות!
                    </a>
                </div>
            </div>
            
            <div class="search-section">
                <div class="row g-3">
                    <div class="col-md-8">
                        <input type="text" id="drugName" class="form-control search-input" placeholder="הזן שם תרופה...">
                    </div>
                    <div class="col-md-4">
                        <button onclick="searchDrug()" class="btn btn-primary search-btn w-100">חפש</button>
                    </div>
                </div>
                <div id="results"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('drugName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchDrug();
        });

        async function searchDrug() {
            const drugName = document.getElementById('drugName').value.trim();
            if (!drugName) return;
            
            document.getElementById('results').innerHTML = '<div class="text-center p-4">מחפש...</div>';
            
            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ drug_name: drugName })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess(data.data);
                } else {
                    showError(data.message, data.searched_names, data.trusted_sources);
                }
            } catch (error) {
                showError('שגיאה בחיפוש');
            }
        }
        
        function showSuccess(data) {
            document.getElementById('results').innerHTML = `
                <div class="result-card">
                    <h4>נמצא מידע!</h4>
                    <h5>${data.name || 'שם התרופה'}</h5>
                    <p>${data.description || 'מידע לא זמין'}</p>
                    ${data.source ? `<small>מקור: ${data.source}</small>` : ''}
                </div>
            `;
        }
        
        function showError(message, searchedNames = [], trustedSources = []) {
            document.getElementById('results').innerHTML = `
                <div class="result-card">
                    <h4>לא נמצא מידע מהימן</h4>
                    <p class="alert alert-warning">${message}</p>
                    ${searchedNames.length ? `<p>חיפשנו עבור: ${searchedNames.join(', ')}</p>` : ''}
                    ${trustedSources.length ? `<p>מקורות: ${trustedSources.join(', ')}</p>` : ''}
                </div>
            `;
        }
    </script>
</body>
</html>

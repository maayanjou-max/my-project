<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סוכן מידע תרופות | Drug Information Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            margin: 2rem auto;
            max-width: 800px;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 2rem;
            border-radius: 20px 20px 0 0;
            text-align: center;
        }
        
        .search-section {
            padding: 2rem;
        }
        
        .search-input {
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            border-color: #4facfe;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.3);
        }
        
        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 15px;
            padding: 1rem 2rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .result-card {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin-top: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-right: 5px solid #4facfe;
        }
        
        .error-card {
            border-right-color: #ff6b6b;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4facfe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .sources-list {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1rem;
        }
        
        .badge-custom {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            margin: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-container">
            <div class="header">
                <h1><i class="fas fa-pills"></i> סוכן מידע תרופות</h1>
                <p class="mb-0">חיפוש מידע מהימן על תרופות ממקורות רפואיים מוסמכים</p>
                <small>MedlinePlus | MicroMedex | UpToDate</small>
            </div>
            
            <div class="search-section">
                <div class="row g-3">
                    <div class="col-md-8">
                        <input type="text" id="drugName" class="form-control search-input" 
                               placeholder="הזן שם תרופה (עברית או אנגלית)...">
                    </div>
                    <div class="col-md-4">
                        <button onclick="searchDrug()" class="btn btn-primary search-btn w-100">
                            <i class="fas fa-search"></i> חפש
                        </button>
                    </div>
                </div>
                
                <div class="mt-3">
                    <small class="text-muted">
                        דוגמאות: פרצטמול, אספירין, נורופן, Tylenol, Advil, Aspirin
                    </small>
                </div>
                
                <div id="results"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // חיפוש בלחיצת Enter
        document.getElementById('drugName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchDrug();
            }
        });

        async function searchDrug() {
            const drugName = document.getElementById('drugName').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (!drugName) {
                showError('יש להזין שם תרופה לחיפוש');
                return;
            }
            
            // הצגת טעינה
            resultsDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p class="mt-3">מחפש מידע מהימן...</p>
                </div>
            `;
            
            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ drug_name: drugName })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showSuccess(data.data);
                } else {
                    showError(data.message, data.searched_names, data.trusted_sources);
                }
                
            } catch (error) {
                console.error('Error:', error);
                showError('שגיאה בחיפוש. אנא נסה שוב.');
            }
        }
        
        function showSuccess(data) {
            const resultsDiv = document.getElementById('results');
            
            let html = `
                <div class="result-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-check-circle text-success me-2"></i>
                        <h4 class="mb-0">מידע נמצא בהצלחה!</h4>
                    </div>
                    
                    <h5><i class="fas fa-pills"></i> ${data.name || 'שם התרופה'}</h5>
                    
                    <div class="mt-3">
                        <h6><i class="fas fa-info-circle"></i> מידע כללי:</h6>
                        <p class="lh-lg">${data.description || 'מידע לא זמין'}</p>
                    </div>
            `;
            
            if (data.searched_names && data.searched_names.length > 1) {
                html += `
                    <div class="mt-3">
                        <h6><i class="fas fa-tags"></i> שמות נוספים:</h6>
                        <div>
                            ${data.searched_names.map(name => 
                                `<span class="badge-custom">${name}</span>`
                            ).join('')}
                        </div>
                    </div>
                `;
            }
            
            if (data.source) {
                html += `
                    <div class="mt-3">
                        <small class="text-muted">
                            <i class="fas fa-source"></i> מקור: ${data.source}
                        </small>
                    </div>
                `;
            }
            
            html += `</div>`;
            resultsDiv.innerHTML = html;
        }
        
        function showError(message, searchedNames = [], trustedSources = []) {
            const resultsDiv = document.getElementById('results');
            
            let html = `
                <div class="result-card error-card">
                    <div class="d-flex align-items-center mb-3">
                        <i class="fas fa-exclamation-triangle text-warning me-2"></i>
                        <h4 class="mb-0">לא נמצא מידע מהימן</h4>
                    </div>
                    
                    <p class="alert alert-warning">
                        <i class="fas fa-shield-alt"></i> ${message}
                    </p>
            `;
            
            if (searchedNames && searchedNames.length > 0) {
                html += `
                    <div class="mt-3">
                        <h6><i class="fas fa-search"></i> חיפשנו עבור השמות:</h6>
                        <div>
                            ${searchedNames.map(name => 
                                `<span class="badge-custom">${name}</span>`
                            ).join('')}
                        </div>
                    </div>
                `;
            }
            
            if (trustedSources && trustedSources.length > 0) {
                html += `
                    <div class="sources-list mt-3">
                        <h6><i class="fas fa-certificate"></i> מקורות מהימנים שנבדקו:</h6>
                        <ul class="list-unstyled mb-0">
                            ${trustedSources.map(source => 
                                `<li><i class="fas fa-check text-success"></i> ${source}</li>`
                            ).join('')}
                        </ul>
                    </div>
                `;
            }
            
            html += `
                <div class="mt-3">
                    <small class="text-muted">
                        <i class="fas fa-lightbulb"></i> 
                        נסה לחפש בשם אחר של התרופה או פנה לרוקח/רופא לקבלת מידע מקצועי.
                    </small>
                </div>
            </div>
            `;
            
            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>

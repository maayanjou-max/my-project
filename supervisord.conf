[supervisord]
nodaemon=false
logfile=/home/user/webapp/drug_agent/supervisord.log
pidfile=/home/user/webapp/drug_agent/supervisord.pid

[unix_http_server]
file=/home/user/webapp/drug_agent/supervisor.sock

[supervisorctl]
serverurl=unix:///home/user/webapp/drug_agent/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:drug_agent]
command=python3 /home/user/webapp/drug_agent/src/app.py
directory=/home/user/webapp/drug_agent
autostart=true
autorestart=true
stdout_logfile=/home/user/webapp/drug_agent/drug_agent.log
stderr_logfile=/home/user/webapp/drug_agent/drug_agent_error.log
environment=PORT="5000",DEBUG="False"